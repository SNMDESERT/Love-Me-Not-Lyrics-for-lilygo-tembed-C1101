name: Build ESP32 Bin

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize Arduino CLI
        run: |
          arduino-cli config init --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Compile Sketch
        run: |
          # Proje içerisindeki .ino dosyasını bulup derler
          arduino-cli compile --fqbn esp32:esp32:esp32s3:JTAGSelect=usb,CDCOnBoot=default,MSCDev=default,UploadMode=default ./

      - name: Find and Upload Bin
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            **/*.bin
            **/*.hex
